name: Build and deploy Sphinx site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ".github/requirements-docs.txt"

      - name: Install dependencies
        run: pip install -r .github/requirements-docs.txt

      - name: Strip saved Plotly HTML outputs for Sphinx
        run: python .github/scripts/strip_plotly_html_outputs.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build Sphinx site
        run: |
          sphinx-build -b html notebooks_build _site
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
